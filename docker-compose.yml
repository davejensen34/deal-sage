services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dealsage
      POSTGRES_USER: dealsage
      POSTGRES_PASSWORD: dealsage-local
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U dealsage"], interval: 5s, timeout: 5s, retries: 10}
  migrate:
    build: ./apps/api
    command: ["python", "-m", "app.ops.schema", "upgrade"]
    environment:
      DATABASE_URL: postgresql+psycopg://dealsage:dealsage-local@postgres:5432/dealsage
      DEMO_MODE: "false"
    depends_on: {postgres: {condition: service_healthy}}
  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql+psycopg://dealsage:dealsage-local@postgres:5432/dealsage
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-development}
      DEMO_MODE: "true"
      AUTH_MODE: ${AUTH_MODE:-demo}
      SESSION_SECRET: ${SESSION_SECRET:-development-only-compose-session-secret}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      WEB_APP_URL: ${WEB_APP_URL:-http://localhost:3000}
      OIDC_PROVIDER: ${OIDC_PROVIDER:-google}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:3000/api/auth/callback}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:-}
      ALLOWED_DOMAINS: ${ALLOWED_DOMAINS:-}
      CORS_ORIGINS: http://localhost:3000
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,api,testserver}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-*}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-disabled}
      WEB_SEARCH_PROVIDER: ${WEB_SEARCH_PROVIDER:-disabled}
      WEB_SEARCH_MAX_RESULTS: ${WEB_SEARCH_MAX_RESULTS:-5}
      WEB_SEARCH_MAX_OUTPUT_TOKENS: ${WEB_SEARCH_MAX_OUTPUT_TOKENS:-300}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-5}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-1000}
      AI_REQUEST_TIMEOUT_SECONDS: ${AI_REQUEST_TIMEOUT_SECONDS:-30}
      AI_MAX_CALLS_PER_CASE: ${AI_MAX_CALLS_PER_CASE:-2}
      AI_MAX_COST_CENTS_PER_CASE: ${AI_MAX_COST_CENTS_PER_CASE:-25}
      AI_STORE_PROVIDER_RESPONSES: ${AI_STORE_PROVIDER_RESPONSES:-false}
    depends_on: {migrate: {condition: service_completed_successfully}}
    volumes: ["evidence-data:/app/data/evidence"]
    healthcheck: {test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/live', timeout=2)"], interval: 5s, timeout: 3s, retries: 10, start_period: 5s}
  web:
    build: ./apps/web
    ports: ["3000:80"]
    depends_on: {api: {condition: service_healthy}}
    healthcheck: {test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/live"], interval: 5s, timeout: 3s, retries: 10, start_period: 5s}
volumes: {postgres-data: {}, evidence-data: {}}
