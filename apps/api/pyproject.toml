[project]
name = "dealsage-api"
version = "0.1.0"
description = "Evidence-backed business ownership intelligence API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "pydantic-settings>=2.4,<3",
  "httpx>=0.27,<1",
  "python-multipart>=0.0.9,<1",
  "psycopg[binary]>=3.2,<4",
  "authlib>=1.3,<2",
  "itsdangerous>=2.2,<3",
  "jsonschema>=4.23,<5",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
ai = ["openai>=1.50,<2", "anthropic>=0.34,<1"]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
